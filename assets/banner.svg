<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16213e;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="200" rx="16" fill="url(#bg)"/>

  <!-- Logo icon (scaled from icon.svg) -->
  <g transform="translate(40, 30) scale(0.27)">
    <!-- Outer ring -->
    <circle cx="256" cy="256" r="190" stroke="#40916c" stroke-width="7" fill="none"/>
    <circle cx="256" cy="256" r="190" stroke="#52b788" stroke-width="24" fill="none"
      stroke-dasharray="358 836"
      transform="rotate(-100 256 256)"/>
    <!-- Middle ring -->
    <circle cx="256" cy="256" r="125" stroke="#40916c" stroke-width="7" fill="none"/>
    <circle cx="256" cy="256" r="125" stroke="#52b788" stroke-width="24" fill="none"
      stroke-dasharray="236 549"
      transform="rotate(50 256 256)"/>
    <!-- Inner ring -->
    <circle cx="256" cy="256" r="68" stroke="#40916c" stroke-width="7" fill="none"/>
    <circle cx="256" cy="256" r="68" stroke="#52b788" stroke-width="20" fill="none"
      stroke-dasharray="128 299"
      transform="rotate(170 256 256)"/>
  </g>

  <!-- Text: Memgraph AI -->
  <text x="165" y="95" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="48" font-weight="700" fill="#ffffff">
    Memgraph AI
  </text>

  <!-- Tagline -->
  <text x="165" y="130" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="18" fill="#94a3b8">
    Memory that helps AI agents learn from their mistakes
  </text>

  <!-- Badges row -->
  <text x="165" y="165" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#64748b">
    Events → Episodes → Beliefs → Decisions    |    Multi-tenant    |    Production-ready
  </text>
</svg>
